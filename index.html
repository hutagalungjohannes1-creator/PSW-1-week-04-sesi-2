<!doctype html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Kegiatan</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main>
        <h1>Pendaftaran Kegiatan</h1>
        <p>Kolom bertanda wajib harus diisi.</p>
        <figure>
            <img src="foto/archimedes.jpg" alt="Asrama Aspa" width="300" height="100">
            <figcaption>Asrama Aspa, tempat kegiatan akan dilaksanakan</figcaption>
        </figure>

        <form action="index.html" method="get">
            <!-- Tambahan Tugas 4: Kode Peserta -->
            <label for="kode">Kode peserta (6 angka, wajib)</label>
            <p id="kode-help">Contoh: 001234. Gunakan tepat enam angka.</p>
            <input id="kode" name="kode" type="text" inputmode="numeric" pattern="[0-9]{6}" aria-describedby="kode-help"
                required>

            <label for="nama">Nama lengkap (wajib)</label>
            <input id="nama" name="nama" type="text" autocomplete="name" required>

            <label for="email">Email (wajib)</label>
            <input id="email" name="email" type="email" autocomplete="email" required>

            <label for="telepon">Nomor Telepon</label>
            <input id="telepon" name="telepon" type="tel" autocomplete="tel">

            <label for="jumlah">Jumlah tiket (1-5, wajib)</label>
            <input id="jumlah" name="jumlah" type="number" min="1" max="5" step="1" required>

            <label for="prodi">Program studi (wajib)</label>
            <select id="prodi" name="prodi" required>
                <option value="">Pilih program studi</option>
                <option value="trpl">D4 TRPL</option>
                <option value="ti">D3 Teknologi Informasi</option>
            </select>

            <fieldset>
                <legend>Mode kehadiran (wajib)</legend>
                <input id="luring" name="mode" type="radio" value="luring" required>
                <label for="luring">Luring</label>
                <input id="daring" name="mode" type="radio" value="daring">
                <label for="daring">Daring</label>
            </fieldset>

            <fieldset>
                <legend>Minat Topik</legend>
                <input id="topik-html" name="topik[]" type="checkbox" value="html">
                <label for="topik-html">HTML</label>

                <input id="topik-aksesibilitas" name="topik[]" type="checkbox" value="aksesibilitas">
                <label for="topik-aksesibilitas">Aksesibilitas</label>
            </fieldset>

            <label for="catatan">Catatan (opsional)</label>
            <textarea id="catatan" name="catatan" rows="4" maxlength="300"></textarea>

            <button type="submit">Daftar</button>
        </form>
    </main>
</body>

</html>
